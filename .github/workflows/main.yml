name: Main

on:
  push:
    branches: [main]

jobs:
  gen:
    name: Gen
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Generate and compare OpenAPI spec
        id: check
        env:
          NODE_ENV: production
        run: |
          node scripts/generate-openapi-spec.ts
          if ! diff -q openapi.yaml /tmp/openapi.yaml > /dev/null 2>&1; then
          echo "OpenAPI spec has changed"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          else
          echo "OpenAPI spec unchanged"
          fi
