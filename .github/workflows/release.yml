name: Release SDK

on:
  push:
    branches: [main, beta]
  repository_dispatch:
    types: [openapi_updated]

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Fetch OpenAPI spec
        run: |
          echo "Fetching latest OpenAPI spec from app repo"
          echo "Would fetch from: https://YOUR-APP-URL/openapi.yaml"
          echo "Triggered from branch: ${{ github.event.client_payload.branch }}"

      - name: Generate SDK with Kiota
        run: |
          echo "Generating SDK with Kiota from openapi.yaml"
          echo "Would run: npx kiota generate -l typescript -d openapi.yaml -o packages/sdk"

      - name: Release
        id: release
        run: npx semantic-release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}